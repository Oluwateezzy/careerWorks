  /api/v1/kyc/status:
    get:
      consumes:
      - application/json
      description: Retrieves the user's current KYC tier, status, linked BVN/NIN info,
        and submitted document statuses.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.SuccessKYCStatusResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Get KYC Status
      tags:
      - KYC
  /api/v1/kyc/submit-document:
    post:
      consumes:
      - multipart/form-data
      description: Saves uploaded identification document details, encrypts the document
        number, and updates user KYC status to pending.
      parameters:
      - description: Type of document (passport, drivers_license, national_id, utility_bill,
          cac_cert)
        in: formData
        name: document_type
        required: true
        type: string
      - description: Document Identification Number
        in: formData
        name: document_number
        required: true
        type: string
      - description: Uploaded Document image/pdf file
        in: formData
        name: document_file
        required: true
        type: file
      - description: Uploaded Selfie image file (optional, required for tier 3)
        in: formData
        name: selfie_file
        type: file
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_auth.SuccessKYCSubmitResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Submit KYC Document
      tags:
      - KYC
  /api/v1/kyc/verify-bvn:
    post:
      consumes:
      - application/json
      description: Verifies the format of the user's BVN, checks for duplicate linkages,
        encrypts and links it to the profile, and upgrades the user's KYC tier/status.
      parameters:
      - description: BVN Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.VerifyBVNDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.SuccessKYCVerifyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify BVN
      tags:
      - KYC
  /api/v1/kyc/verify-nin:
    post:
      consumes:
      - application/json
      description: Verifies the format of the user's NIN, checks for duplicate linkages,
