  /api/v1/payments/initialize:
    post:
      consumes:
      - application/json
      description: Initiates a payment for an accepted escrow contract and returns
        the Paystack authorization URL.
      parameters:
      - description: Payment Initialization Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_payment.InitializePaymentDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
