            $ref: '#/definitions/internal_payment.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_payment.StandardErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_payment.StandardErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_payment.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_payment.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Initialize payment
      tags:
      - Payments
  /api/v1/payments/verify/{reference}:
    get:
      consumes:
      - application/json
      description: Manually polls and verifies the status of a payment using its reference
        on Paystack.
      parameters:
      - description: Paystack or System Payment Reference
        in: path
        name: reference
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_payment.VerifyPaymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_payment.StandardErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_payment.StandardErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_payment.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_payment.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify payment
      tags:
      - Payments
  /api/v1/payments/webhook/paystack:
    post:
      consumes:
      - application/json
      description: Processes real-time webhook events sent by Paystack (verifies HMAC
        signatures).
      parameters:
      - description: HMAC-SHA512 signature header
        in: header
        name: X-Paystack-Signature
        required: true
        type: string
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_payment.StandardErrorResponse'
      summary: Paystack Webhook Handler
      tags:
      - Payments
  /api/v1/wallet:
    get:
      consumes:
      - application/json
      description: Retrieves the balance, currency, and frozen status of the authenticated
        user's primary seller wallet.
      produces:
      - application/json
      responses:
        "200":
          description: Returns balance_kobo, currency, is_frozen
          schema:
            allOf:
            - $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get wallet balance
      tags:
      - Wallet
  /api/v1/wallet/banks:
    get:
      consumes:
      - application/json
      description: Retrieves the list of supported Nigerian banks from Paystack.
      produces:
      - application/json
      responses:
        "200":
          description: Returns list of banks
          schema:
            allOf:
            - $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_wallet.Bank'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get Nigerian banks list
      tags:
      - Wallet
  /api/v1/wallet/transactions:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of ledger entries for the user's primary
        wallet, sorted by created_at DESC.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Returns paginated list of ledger entries
          schema:
            allOf:
            - $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_wallet.LedgerEntry'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get wallet transactions
      tags:
      - Wallet
  /api/v1/wallet/verify-account:
    post:
      consumes:
      - application/json
      description: Resolves a bank account number and bank code via Paystack API to
        confirm the account name.
      parameters:
      - description: Account details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_wallet.VerifyAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns resolved account name
          schema:
            allOf:
            - $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_wallet.AccountDetails'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
      security:
      - BearerAuth: []
      summary: Verify NUBAN bank account
      tags:
      - Wallet
  /api/v1/wallet/withdraw:
    post:
      consumes:
      - application/json
      description: Initiates a bank payout request. Validates tier limits, sufficient
        balance, 24h cooldown on first withdrawal, debits wallet and creates pending
        payout record. Requires KYC Tier >= 1.
      parameters:
      - description: Withdrawal details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_wallet.WithdrawRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns the created pending withdrawal record
          schema:
            allOf:
            - $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_wallet.Withdrawal'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
      security:
      - BearerAuth: []
      summary: Request withdrawal
      tags:
      - Wallet
  /api/v1/wallet/withdrawals:
    get:
      consumes:
      - application/json
      description: Retrieves a paginated list of withdrawal requests submitted by
        the authenticated user, ordered by created_at DESC.
      parameters:
      - description: Page number (default 1)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20)
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Returns paginated list of withdrawals
          schema:
            allOf:
            - $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_wallet.Withdrawal'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
      security:
      - BearerAuth: []
      summary: Get withdrawals history
      tags:
      - Wallet
securityDefinitions:
  BearerAuth:
    description: Paste your raw JWT access token.
    in: header
    name: Authorization
    type: apiKey
