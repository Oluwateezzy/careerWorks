        type: array
      message:
        example: Operation successful
        type: string
      meta:
        $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.PaginationMeta'
      success:
        example: true
        type: boolean
    type: object
  internal_escrow.SuccessEscrowResponse:
    properties:
      data:
        $ref: '#/definitions/internal_escrow.Escrow'
      message:
        example: Operation successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_escrow.SuccessMessageResponse:
    properties:
      data:
        $ref: '#/definitions/internal_escrow.Message'
      message:
        example: Operation successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_escrow.SuccessMessagesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_escrow.Message'
        type: array
      message:
        example: Operation successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_escrow.SuccessMilestoneResponse:
    properties:
      data:
        $ref: '#/definitions/internal_escrow.EscrowMilestone'
      message:
        example: Operation successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_escrow.SuccessMilestonesResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/internal_escrow.EscrowMilestone'
        type: array
      message:
        example: Operation successful
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_escrow.UpdateEscrowDTO:
    properties:
      amount_kobo:
        type: integer
      delivery_date:
        type: string
      description:
        type: string
      inspection_period_days:
        type: integer
      title:
        type: string
    type: object
  internal_payment.InitializePaymentDTO:
    properties:
      callback_url:
        type: string
      escrow_id:
        type: string
    required:
    - callback_url
    - escrow_id
    type: object
  internal_payment.InitializePaymentResponse:
    properties:
      data:
        properties:
          authorization_url:
            example: https://checkout.paystack.com/auth123
            type: string
          reference:
            example: VESC_REF_abc123
            type: string
        type: object
      message:
        example: Payment initialized successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_payment.StandardErrorResponse:
    properties:
      message:
        example: An error occurred
        type: string
      success:
        example: false
        type: boolean
    type: object
  internal_payment.ValidationErrorResponse:
    properties:
      errors:
        items:
          $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.FieldError'
        type: array
      message:
        example: Validation failed
        type: string
      success:
        example: false
        type: boolean
    type: object
  internal_payment.VerifyPaymentResponse:
    properties:
      data:
        properties:
          amount_kobo:
            example: 150000
            type: integer
          paid_at:
            type: string
          reference:
            example: VESC_REF_abc123
            type: string
          status:
            example: confirmed
            type: string
        type: object
      message:
        example: Payment status retrieved
        type: string
      success:
        example: true
        type: boolean
    type: object
  internal_wallet.AccountDetails:
    properties:
      account_name:
        type: string
      account_number:
        type: string
    type: object
  internal_wallet.Bank:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  internal_wallet.EntryType:
    enum:
    - debit
    - credit
    type: string
    x-enum-varnames:
    - EntryTypeDebit
    - EntryTypeCredit
  internal_wallet.LedgerCategory:
    enum:
    - escrow_fund
    - escrow_release
    - escrow_refund
    - withdrawal
    - platform_fee
    - deposit
    type: string
    x-enum-varnames:
    - CategoryEscrowFund
    - CategoryEscrowRelease
    - CategoryEscrowRefund
    - CategoryWithdrawal
    - CategoryPlatformFee
    - CategoryDeposit
  internal_wallet.LedgerEntry:
    properties:
      amount_kobo:
        description: Always positive
        type: integer
      balance_after_kobo:
        description: Snapshot of balance
        type: integer
      category:
        $ref: '#/definitions/internal_wallet.LedgerCategory'
      created_at:
        type: string
      description:
        type: string
      entry_type:
        allOf:
        - $ref: '#/definitions/internal_wallet.EntryType'
        description: debit | credit
      escrow:
        $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_escrow.Escrow'
      escrow_id:
        type: string
      id:
        type: string
      reference:
        type: string
      wallet_id:
        type: string
    type: object
  internal_wallet.VerifyAccountRequest:
    properties:
      account_number:
        type: string
      bank_code:
        type: string
    required:
    - account_number
    - bank_code
    type: object
  internal_wallet.WithdrawRequest:
    properties:
      account_name:
        type: string
      account_number:
        type: string
      amount_kobo:
        type: integer
      bank_code:
        type: string
    required:
    - account_name
    - account_number
    - amount_kobo
    - bank_code
    type: object
  internal_wallet.Withdrawal:
    properties:
      account_name:
        type: string
      account_number:
        type: string
      amount_kobo:
        type: integer
      bank_code:
        type: string
      completed_at:
        type: string
      created_at:
        type: string
      failure_reason:
        type: string
      id:
        type: string
      recipient_code:
        type: string
      status:
        $ref: '#/definitions/internal_wallet.WithdrawalStatus'
      transfer_code:
        type: string
      user:
        $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.User'
      user_id:
        type: string
      wallet_id:
        type: string
    type: object
  internal_wallet.WithdrawalStatus:
    enum:
    - pending
    - processing
    - completed
    - failed
    - reversed
    type: string
    x-enum-varnames:
    - WithdrawalStatusPending
    - WithdrawalStatusProcessing
    - WithdrawalStatusCompleted
    - WithdrawalStatusFailed
    - WithdrawalStatusReversed
host: localhost:3000
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: Vescrow Escrow Backend API Service with Authentication, Wallets, and
    Escrows.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Vescrow API
  version: "1.0"
paths:
  /api/v1/admin/kyc/submissions:
    get:
      consumes:
      - application/json
      description: Retrieves a list of submitted KYC documents, with optional status
        filtering.
      parameters:
      - description: Filter by document status (pending, approved, rejected)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns list of kyc document submissions preloaded with user
            details
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: List KYC submissions
      tags:
      - Admin Operations
  /api/v1/admin/kyc/submissions/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves details of a specific KYC document submission by its
        ID, including the decrypted document number.
      parameters:
      - description: KYC Submission ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns detailed submission record with decrypted PII
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Get KYC submission details
      tags:
      - Admin Operations
  /api/v1/admin/kyc/submissions/{id}/approve:
    put:
      consumes:
      - application/json
      description: Approves a user's pending KYC submission, promoting the user's
        KYC tier based on the document type, and logs audit.
      parameters:
      - description: KYC Submission ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Returns upgraded user tier and document status
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve KYC Submission
      tags:
      - Admin Operations
  /api/v1/admin/kyc/submissions/{id}/reject:
    put:
      consumes:
      - application/json
      description: Rejects a user's pending KYC submission, requiring a mandatory
        rejection reason, updates status, and logs audit.
      parameters:
      - description: KYC Submission ID
        in: path
        name: id
        required: true
        type: string
      - description: Rejection details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_admin.ApproveRejectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns rejection confirmation
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_common.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Reject KYC Submission
      tags:
      - Admin Operations
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows a logged-in user to change their password after validating
        their current password.
      parameters:
      - description: Change Password Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ChangePasswordDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Authentication
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiates password recovery. Generates a password reset OTP and
        sends it (mocked). Always returns 200 OK to prevent email enumeration.
      parameters:
      - description: Forgot Password Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ForgotPasswordDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      summary: Request password reset
      tags:
      - Authentication
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Validates user credentials (email and password), logs login event
        to audit trail, and returns an access token. Sets the refresh token as an
        HTTP-only secure cookie.
      parameters:
      - description: Login Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Returns access_token in body and refresh_token in HttpOnly
            cookie
          schema:
            $ref: '#/definitions/internal_auth.SuccessLoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      summary: Login user
      tags:
      - Authentication
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the current session by clearing the refresh token cookie.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Authentication
  /api/v1/auth/profile:
    get:
      consumes:
      - application/json
      description: Retrieves the profile details of the currently authenticated user.
        PII fields (email, phone) are masked in the response.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.SuccessUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Authentication
    put:
      consumes:
      - application/json
      description: Updates the allowed profile fields (name, avatar_url) of the authenticated
        user.
      parameters:
      - description: Profile Update Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.UpdateProfileDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.SuccessUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user profile
      tags:
      - Authentication
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Uses the refresh token from the HTTP-only cookie to generate and
        return a new access token and refresh token pair.
      produces:
      - application/json
      responses:
        "200":
          description: Returns new access_token in body and refresh_token in HttpOnly
            cookie
          schema:
            $ref: '#/definitions/internal_auth.SuccessLoginResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      summary: Refresh access token
      tags:
      - Authentication
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user with default 'user' role and KYC tier. Automatically
        creates a default 'seller' wallet and logs a USER_REGISTERED event in the
        audit trail.
      parameters:
      - description: Registration Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.RegisterDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_auth.SuccessUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      summary: Register a new user
      tags:
      - Authentication
  /api/v1/auth/resend-otp:
    post:
      consumes:
      - application/json
      description: Generates and resends a new 6-digit OTP to the specified target
        (email or phone).
      parameters:
      - description: OTP Request Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ResendOTPDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      summary: Resend verification OTP
      tags:
      - Authentication
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Completes password recovery by validating the password reset OTP
        and updating the user's password.
      parameters:
      - description: Reset Password Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ResetPasswordDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      summary: Reset password
      tags:
      - Authentication
  /api/v1/auth/verify-email:
    post:
      consumes:
      - application/json
      description: Verifies user email using the 6-digit OTP sent to their email.
        Marks email_verified as true and upgrades user to KYC Tier 1.
      parameters:
      - description: Verification Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.VerifyEmailDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      summary: Verify user email
      tags:
      - Authentication
  /api/v1/auth/verify-phone:
    post:
      consumes:
      - application/json
      description: Verifies user phone number using the 6-digit OTP sent to their
        phone.
      parameters:
      - description: Verification Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.VerifyPhoneDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_auth.ValidationErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      summary: Verify user phone number
      tags:
      - Authentication
  /api/v1/disputes:
    get:
      consumes:
      - application/json
      description: User sees disputes on their escrows. Admin sees all disputes with
        optional status filter.
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Filter by dispute status (admin only)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_dispute.SuccessDisputeListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: List disputes
      tags:
      - Disputes
    post:
      consumes:
      - application/json
      description: Buyer opens a dispute on a delivered escrow. Escrow status transitions
        to 'disputed' and funds are locked.
      parameters:
      - description: Open Dispute Details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_dispute.OpenDisputeDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_dispute.SuccessDisputeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.ValidationErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_didihart_vescrow_backend_internal_auth.StandardErrorResponse'
        "409":
