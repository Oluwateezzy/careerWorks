          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_auth.StandardErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify NIN
      tags:
